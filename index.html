<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duo Sempre</title>
<meta property="og:title" content="É OS GURIS, DUO SEMPRE">
<meta property="og:description" content="Hoje é par ou ímpar?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --campo: #1A2BC9;
    --campo-fundo: #0D1670;
    --giz: #F2F0FF;
    --giz-suave: #B9BEF5;
    --ouro: #FFD23F;
    --display: "Anton", "Impact", "Arial Narrow", sans-serif;
    --label: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  }

  html { height: 100%; background-color: var(--campo-fundo); }

  body {
    min-height: 100%;
    margin: 0;
    background:
      radial-gradient(120% 80% at 50% 0%, var(--campo) 0%, var(--campo-fundo) 100%);
    background-color: var(--campo-fundo);
    color: var(--giz);
    font-family: var(--label);
    display: flex;
    flex-direction: column;
    padding-inline: 16px;
    padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    overflow-x: hidden;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    width: 100%;
    max-width: 1100px;
    margin-inline: auto;
    text-align: center;
  }

  .hoje {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .rotulo {
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ouro);
  }

  .data-extenso {
    font-weight: 500;
    font-size: clamp(1.15rem, 3.2vw, 1.6rem);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--giz-suave);
  }

  .placar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .numero {
    font-family: var(--display);
    font-size: clamp(9rem, 38vw, 20rem);
    line-height: 0.85;
    font-variant-numeric: tabular-nums;
    color: var(--giz);
    text-shadow: 0 6px 0 var(--campo-fundo);
  }

  .paridade {
    font-family: var(--display);
    font-size: clamp(2.6rem, 10vw, 5rem);
    line-height: 1;
    letter-spacing: 0.06em;
    color: var(--campo-fundo);
    background: var(--ouro);
    padding: 0.08em 0.45em 0.12em;
    border-radius: 6px;
    transform: rotate(-2deg);
  }

  .grito {
    font-family: var(--display);
    font-size: clamp(3.4rem, 13.5vw, 10.5rem);
    font-weight: 400;
    line-height: 0.92;
    text-transform: uppercase;
    text-wrap: balance;
    margin: 0;
    color: var(--ouro);
    letter-spacing: 0.01em;
  }

  .grito span { display: block; }
  .grito .duo { color: var(--giz); }

  @media (prefers-reduced-motion: no-preference) {
    .paridade { animation: carimbo 520ms cubic-bezier(.2, 1.4, .4, 1) both; }
    @keyframes carimbo {
      from { transform: rotate(-2deg) scale(1.25); }
      to   { transform: rotate(-2deg) scale(1); }
    }
  }
</style>
</head>
<body>
<main>
  <section class="hoje" aria-label="Data de hoje">
    <span class="rotulo">Hoje é</span>
    <span class="data-extenso" id="data-extenso">&nbsp;</span>
  </section>

  <section class="placar" aria-live="polite">
    <div class="numero" id="numero">&nbsp;</div>
    <div class="paridade" id="paridade">&nbsp;</div>
  </section>

  <h1 class="grito">
    <span>É os guris,</span>
    <span class="duo">duo sempre</span>
  </h1>
</main>

<script>
  (function () {
    var elData = document.getElementById("data-extenso");
    var elNumero = document.getElementById("numero");
    var elParidade = document.getElementById("paridade");

    function atualizar() {
      var agora = new Date();
      var dia = agora.getDate();
      var texto;
      try {
        texto = agora.toLocaleDateString("pt-BR", {
          weekday: "long", day: "numeric", month: "long", year: "numeric"
        });
      } catch (e) {
        texto = agora.toLocaleDateString();
      }
      elData.textContent = texto;
      elNumero.textContent = String(dia);
      elParidade.textContent = dia % 2 === 0 ? "PAR" : "ÍMPAR";
    }

    atualizar();
    // Troca sozinho na virada do dia, mesmo com a página aberta
    setInterval(atualizar, 30000);
  })();
</script>
</body>
</html>
